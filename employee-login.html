<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="NIRA LLC employee portal — sign in to Nydora Financial Systems." />
  <meta name="robots" content="noindex" />
  <title>Employee Login | NIRA LLC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    .login-wrap { min-height: 100vh; display: grid; place-items: center;
      background: linear-gradient(135deg, var(--navy) 0%, var(--navy-dark) 100%); padding: 2rem; }
    .login-card { width: 100%; max-width: 460px; background: #fff; border-radius: 18px;
      box-shadow: 0 24px 70px rgba(0,0,0,.28); padding: 2.6rem 2.4rem; text-align: center; }
    .login-card img { height: 52px; margin-bottom: .4rem; }
    .login-card h1 { font-size: 1.5rem; color: var(--navy); margin: .5rem 0 .25rem; }
    .login-card .sub { color: var(--muted); font-size: .95rem; margin-bottom: 1.6rem; }
    .login-card .portal-name { font-weight: 700; color: var(--navy); }
    .login-card .btn { width: 100%; justify-content: center; font-size: 1rem; padding: .85rem 1rem; }
    .login-note { font-size: .8rem; color: var(--muted); margin-top: 1.4rem; line-height: 1.5; }
    .login-back { display: inline-block; margin-top: 1.2rem; color: var(--navy); font-weight: 600; font-size: .85rem; }
    .secure-row { display:flex; align-items:center; justify-content:center; gap:.4rem;
      color: var(--muted); font-size:.8rem; margin-bottom:1.4rem; }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <img src="Nira LLC Logo.png" alt="NIRA LLC" />
      <h1>Employee Portal</h1>
      <p class="sub">Sign in to <span class="portal-name">Nydora Financial Systems</span></p>

      <div class="secure-row">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        Secure sign-in for authorized NIRA LLC staff
      </div>

      <a href="https://erp.nirallc.com/login" class="btn btn-primary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
        Continue to Sign In
      </a>

      <p class="login-note">
        This portal is for authorized NIRA LLC employees only. If you cannot reach the sign-in
        page, the system may be offline — contact your administrator.
      </p>
      <a class="login-back" href="index.html">← Back to nirallc.com</a>
    </div>
  </div>
</body>
</html>
